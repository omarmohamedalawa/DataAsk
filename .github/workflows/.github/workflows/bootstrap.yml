name: Bootstrap project files
on:
  push:
    paths: ["payload.b64"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project, remove payload, redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base64 -d payload.b64 | tar xz
          git rm -q payload.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add DataAsk project files"
          git push
          gh workflow run pages.yml
