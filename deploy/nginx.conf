# nginx reverse proxy (TLS certificate from Let's Encrypt / certbot). Run DataAsk with TRUST_PROXY=1 COOKIE_SECURE=1.
server {
    listen 443 ssl http2;
    server_name dataask.example.com;
    ssl_certificate     /etc/letsencrypt/live/dataask.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dataask.example.com/privkey.pem;
    client_max_body_size 6m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # DataAsk takes the last value of this header
        proxy_set_header X-Forwarded-Proto https;
    }
}
server { listen 80; server_name dataask.example.com; return 301 https://$host$request_uri; }
